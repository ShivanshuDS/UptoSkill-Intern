<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Transcription</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0c0d0f;
            --surface: #141518;
            --surface-2: #1c1e23;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.14);
            --text-primary: #f0f0ee;
            --text-secondary: #8a8c96;
            --text-muted: #4a4c55;
            --accent: #e8ff5a;
            --accent-dim: rgba(232,255,90,0.1);
            --accent-glow: rgba(232,255,90,0.25);
            --red: #ff5a5a;
            --red-dim: rgba(255,90,90,0.12);
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 3rem 1.5rem;
        }

        /* HEADER */
        .header {
            width: 100%;
            max-width: 720px;
            margin-bottom: 3rem;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        .logo-label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: var(--text-primary);
        }

        h1 span {
            color: var(--accent);
        }

        /* CONTROLS CARD */
        .controls-card {
            width: 100%;
            max-width: 720px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* RECORD BUTTON */
        .record-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: #0c0d0f;
            border: none;
            border-radius: 50px;
            padding: 0 1.5rem;
            height: 48px;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .record-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .record-btn:active { transform: scale(0.97); }

        .record-btn.recording {
            background: var(--red-dim);
            color: var(--red);
            border: 1px solid rgba(255,90,90,0.3);
        }

        .record-btn.recording:hover {
            box-shadow: 0 8px 24px rgba(255,90,90,0.2);
        }

        /* PULSE DOT */
        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0c0d0f;
            flex-shrink: 0;
        }

        .recording .pulse-dot {
            background: var(--red);
            animation: pulse 1.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.75); }
        }

        /* STATUS PILL */
        .status-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 0 14px;
            height: 40px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .status-indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-indicator.active {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 6px var(--accent-glow); }
            50% { box-shadow: 0 0 14px var(--accent-glow); }
        }

        /* CLEAR BUTTON */
        .clear-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 0 14px;
            height: 40px;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: auto;
        }

        .clear-btn:hover {
            color: var(--text-secondary);
            border-color: var(--border-hover);
        }

        /* TRANSCRIPT CARD */
        .transcript-card {
            width: 100%;
            max-width: 720px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            min-height: 320px;
            display: flex;
            flex-direction: column;
        }

        .transcript-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .transcript-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .word-count {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* WAVEFORM */
        .waveform-bar {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 0 1.5rem;
            height: 40px;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }

        .wave-stick {
            width: 3px;
            border-radius: 3px;
            background: var(--border-hover);
            height: 6px;
            transition: height 0.1s ease;
            flex-shrink: 0;
        }

        .wave-stick.active {
            background: var(--accent);
            animation: wave 0.8s ease-in-out infinite;
        }

        .wave-stick:nth-child(2n).active { animation-delay: 0.1s; }
        .wave-stick:nth-child(3n).active { animation-delay: 0.2s; }
        .wave-stick:nth-child(4n).active { animation-delay: 0.35s; }
        .wave-stick:nth-child(5n).active { animation-delay: 0.15s; }

        @keyframes wave {
            0%, 100% { height: 6px; }
            50% { height: 22px; }
        }

        /* TRANSCRIPT BODY */
        .transcript-body {
            flex: 1;
            padding: 1.5rem;
            font-family: 'DM Mono', monospace;
            font-size: 15px;
            font-weight: 300;
            line-height: 1.8;
            color: var(--text-secondary);
            overflow-y: auto;
            min-height: 240px;
        }

        .transcript-body.has-text {
            color: var(--text-primary);
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 200px;
            text-align: center;
            flex-direction: column;
            gap: 0.5rem;
        }

        .placeholder-icon {
            font-size: 32px;
            opacity: 0.3;
            margin-bottom: 0.25rem;
        }

        /* New word highlight */
        .new-word {
            color: var(--accent);
            animation: fadeToWhite 1.5s forwards;
        }

        @keyframes fadeToWhite {
            0% { color: var(--accent); }
            100% { color: var(--text-primary); }
        }

        /* FOOTER STATS */
        .footer-stats {
            width: 100%;
            max-width: 720px;
            display: flex;
            gap: 1px;
            margin-top: 1.5rem;
        }

        .stat-box {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem 1.25rem;
            text-align: center;
        }

        .stat-box:first-child { border-radius: 12px 0 0 12px; }
        .stat-box:last-child { border-radius: 0 12px 12px 0; }

        .stat-value {
            font-family: 'DM Mono', monospace;
            font-size: 22px;
            font-weight: 500;
            color: var(--text-primary);
            display: block;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo-row">
            <div class="logo-dot"></div>
            <span class="logo-label">Real-time AI</span>
        </div>
        <h1>Live <span>Transcription</span></h1>
    </header>

    <!-- CONTROLS -->
    <div class="controls-card">
        <div class="controls-row">
            <button class="record-btn" id="recordBtn" onclick="toggleRecording()">
                <div class="pulse-dot"></div>
                <span id="btnLabel">Start Recording</span>
            </button>

            <div class="status-pill">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Idle</span>
            </div>

            <button class="clear-btn" onclick="clearTranscript()">
                ✕ Clear
            </button>
        </div>
    </div>

    <!-- TRANSCRIPT -->
    <div class="transcript-card">
        <div class="transcript-header">
            <span class="transcript-label">Transcript</span>
            <span class="word-count" id="wordCount">0 words</span>
        </div>

        <!-- WAVEFORM -->
        <div class="waveform-bar" id="waveform"></div>

        <!-- BODY -->
        <div class="transcript-body" id="output">
            <div class="placeholder-text" id="placeholder">
                <div class="placeholder-icon">🎙</div>
                <span>Press Start Recording to begin</span>
                <span style="font-size:12px; opacity:0.6;">Transcription will appear here</span>
            </div>
        </div>
    </div>

    <!-- FOOTER STATS -->
    <div class="footer-stats">
        <div class="stat-box">
            <span class="stat-value" id="statWords">0</span>
            <div class="stat-label">Words</div>
        </div>
        <div class="stat-box">
            <span class="stat-value" id="statTime">0:00</span>
            <div class="stat-label">Duration</div>
        </div>
        <div class="stat-box">
            <span class="stat-value" id="statChars">0</span>
            <div class="stat-label">Characters</div>
        </div>
    </div>

    <script>
        let socket;
        let mediaRecorder;
        let isRecording = false;
        let startTime;
        let timerInterval;
        let totalText = '';

        // Build waveform sticks
        const waveform = document.getElementById('waveform');
        for (let i = 0; i < 60; i++) {
            const stick = document.createElement('div');
            stick.className = 'wave-stick';
            waveform.appendChild(stick);
        }

        function setWaveActive(active) {
            document.querySelectorAll('.wave-stick').forEach(s => {
                s.classList.toggle('active', active);
            });
        }

        function updateStats() {
            const words = totalText.trim() === '' ? 0 : totalText.trim().split(/\s+/).length;
            const chars = totalText.length;
            document.getElementById('wordCount').textContent = words + ' word' + (words !== 1 ? 's' : '');
            document.getElementById('statWords').textContent = words;
            document.getElementById('statChars').textContent = chars;
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const m = Math.floor(elapsed / 60);
            const s = elapsed % 60;
            document.getElementById('statTime').textContent = m + ':' + String(s).padStart(2, '0');
        }

        function appendWord(text) {
            const placeholder = document.getElementById('placeholder');
            if (placeholder) placeholder.remove();

            const output = document.getElementById('output');
            output.classList.add('has-text');

            const span = document.createElement('span');
            span.className = 'new-word';
            span.textContent = text + ' ';
            output.appendChild(span);
            output.scrollTop = output.scrollHeight;

            totalText += text + ' ';
            updateStats();
        }

        async function toggleRecording() {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        }

        async function startRecording() {
            try {
                socket = new WebSocket("ws://localhost:8000/ws");

                socket.onopen = () => {
                    console.log("WebSocket Connected");
                    isRecording = true;
                    startTime = Date.now();
                    timerInterval = setInterval(updateTimer, 1000);

                    const btn = document.getElementById('recordBtn');
                    btn.classList.add('recording');
                    document.getElementById('btnLabel').textContent = 'Stop Recording';
                    document.getElementById('statusIndicator').classList.add('active');
                    document.getElementById('statusText').textContent = 'Live';
                    setWaveActive(true);
                };

                socket.onmessage = (event) => {
                    appendWord(event.data);
                };

                socket.onclose = () => {
                    console.log("WebSocket Closed");
                    stopRecording();
                };

                socket.onerror = () => {
                    document.getElementById('statusText').textContent = 'Connection error';
                };

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start(2000);
                mediaRecorder.ondataavailable = async (event) => {
                    if (event.data.size > 0 && socket.readyState === WebSocket.OPEN) {
                        const arrayBuffer = await event.data.arrayBuffer();
                        socket.send(arrayBuffer);
                    }
                };

            } catch (err) {
                document.getElementById('statusText').textContent = 'Mic access denied';
                console.error(err);
            }
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
            if (socket && socket.readyState === WebSocket.OPEN) socket.close();

            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('btnLabel').textContent = 'Start Recording';
            document.getElementById('statusIndicator').classList.remove('active');
            document.getElementById('statusText').textContent = 'Stopped';
            setWaveActive(false);
        }

        function clearTranscript() {
            totalText = '';
            const output = document.getElementById('output');
            output.innerHTML = `
                <div class="placeholder-text" id="placeholder">
                    <div class="placeholder-icon">🎙</div>
                    <span>Press Start Recording to begin</span>
                    <span style="font-size:12px; opacity:0.6;">Transcription will appear here</span>
                </div>`;
            output.classList.remove('has-text');
            document.getElementById('statTime').textContent = '0:00';
            updateStats();
        }
    </script>
</body>
</html>
